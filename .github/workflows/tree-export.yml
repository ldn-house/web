name: Tree export

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: tree-export
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.validate.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - id: compare
        run: bun scripts/tree-export-changed.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A broken export leaves the current deploy alone.
      - id: validate
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        run: bun scripts/fetch-tree-export.ts

  deploy:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
