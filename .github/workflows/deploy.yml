name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_call:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Queued production runs may start out of order, so each tests and deploys main as it is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/fetch-tree-export.ts --optional
      - run: bun run test
      - run: bun run build

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      pull-requests: write
    env:
      SEED_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Provision database and preview config
        run: bun scripts/preview/provision.ts
        env:
          PR_NUMBER: ${{ github.event.number }}

      - run: bun scripts/fetch-tree-export.ts --optional

      # The Cloudflare plugin reads this and writes the matching deploy redirect,
      # so the deploy below needs no --config of its own.
      - name: Build
        run: bun run build
        env:
          WRANGLER_CONFIG: wrangler.preview.json

      - name: Deploy
        id: deploy
        run: |
          bunx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # wrangler reports success before the workers.dev hostname serves, so
      # seeding immediately after deploy races the route becoming live.
      - name: Wait for the deployment to answer
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "${{ steps.deploy.outputs.url }}/api/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "preview did not become reachable within 60s" >&2
          exit 1

      # A 401 here means the previous deployment, with the old token, is still
      # answering; the new version can take a little while to propagate. A new
      # preview's hostname can also answer Cloudflare's 404 "error code: 1042"
      # for a few seconds after the health check passes.
      - name: Seed from the captured fixture
        run: |
          for _ in $(seq 1 20); do
            status=$(curl --silent --output seed.out --write-out '%{http_code}' \
              -X POST "${{ steps.deploy.outputs.url }}/api/seed" \
              -H "Authorization: Bearer $SEED_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @src/fixtures/octopus.json)
            if [ "$status" = "200" ]; then cat seed.out; exit 0; fi
            if [ "$status" != "401" ] && ! { [ "$status" = "404" ] && grep -q 'error code: 1042' seed.out; }; then
              echo "seed failed with $status"; cat seed.out; exit 1
            fi
            sleep 3
          done
          echo "new deployment not serving the seed route after 60s" >&2
          exit 1

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body \
            "Preview: ${{ steps.deploy.outputs.url }} — seeded from \`src/fixtures/octopus.json\`, isolated database \`ldn-house-pr-${{ github.event.number }}\`."

      # Recorded against the PR head, not the merge commit, so the pull request
      # links it. One shared environment avoids an environment per PR, and
      # auto_inactive stays off so a push to one PR keeps the others' links.
      - name: Record deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id=$(jq -n --arg ref "$SHA" --argjson pr "$PR_NUMBER" '{ref: $ref,
            environment: "pr-preview", payload: {pr: $pr}, auto_merge: false,
            required_contexts: [], transient_environment: true,
            production_environment: false}' |
            gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          jq -n --arg url "$URL" --arg log "$LOG_URL" '{state: "success",
            environment_url: $url, log_url: $log, auto_inactive: false}' |
            gh api "repos/$GH_REPO/deployments/$id/statuses" --input - --silent

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # Rerunning failed jobs keeps the commit check tested, which may now be behind.
      - if: github.run_attempt != '1'
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main has moved past $(git rev-parse --short HEAD); re-run all jobs instead"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # A refresh for the tree export stops here rather than deploying without it.
      - run: bun scripts/fetch-tree-export.ts ${{ github.event_name == 'push' && '--optional' || '' }}

      # A push deploy may have shipped the same export while this refresh waited.
      - id: tree
        if: github.event_name != 'push'
        run: bun scripts/tree-export-changed.ts --published "$(jq -r .archive src/tree-export/index.json)"

      # Migrations run before the deploy, so new code never meets an old schema.
      # Only safe while migrations stay additive; a destructive change needs
      # expand/contract across two deploys.
      - if: steps.tree.outputs.changed != 'false'
        run: bun run db:migrate:remote
        env:
          CI: "true"

      - if: steps.tree.outputs.changed != 'false'
        run: bun run build
      - if: steps.tree.outputs.changed != 'false'
        run: bunx wrangler deploy

  teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/preview/teardown.ts
        env:
          PR_NUMBER: ${{ github.event.number }}

      # The Worker is gone, so its links on the pull request would be dead.
      - name: Deactivate deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          gh api --paginate "repos/$GH_REPO/deployments?environment=pr-preview&per_page=100" \
            --jq ".[] | select(.payload.pr == $PR_NUMBER) | .id" |
            while read -r id; do
              gh api "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive --silent
            done
